name: Arduino Library CI

on:
  push:
    branches: [ "master", "port-to-2.0.0-api" ]
  pull_request:
    branches: [ "master", "port-to-2.0.0-api" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the bug-hunt branch from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the official Arduino CLI tool
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # Step 3: Symlink this repository into the local Arduino library path
      # This allows the CLI compiler to locate and include your "MPU_Pro_Mini_lib"
      - name: Install Local Library
        run: |
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/MPU_Pro_Mini_lib

      # Step 4: Compile all the example sketches to look for bugs.
      # Replace "ExampleName" with the actual folder name inside your /examples directory
      - name: Compile all examples
        run: |
          for example in $HOME/Arduino/libraries/MPU_Pro_Mini_lib/examples/*; do
            if [ -d "$example" ]; then
              arduino-cli compile --warnings all "$example"
            fi
          done
