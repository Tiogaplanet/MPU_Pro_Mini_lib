name: Arduino Library Release Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # e.g. v2.0.0

jobs:
  validate-and-build:
    name: Lint & Compile Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Arduino Lint
        uses: arduino/arduino-lint-action@v1
        with:
          compliance: specification
          library-manager: submit

      # Official action (same as arduino-compile.yml)
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # Required: install the AVR core so the FQBN works
      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          
      - name: Install Local Library
        run: |
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/MPU_Pro_Mini_lib

      - name: Compile all examples
        run: |
          for example in $HOME/Arduino/libraries/MPU_Pro_Mini_lib/examples/*; do
            if [ -d "$example" ]; then
              echo "Building $example..."
              arduino-cli compile --warnings all --fqbn arduino:avr:pro:cpu=16MHzatmega328 "$example"
            fi
          done

  publish-release:
    name: Create GitHub Release
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: vars
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Package Library ZIP
        run: |
          ZIP_NAME="MPU_Pro_Mini-${{ steps.vars.outputs.VERSION }}.zip"
          zip -r "$ZIP_NAME" . -x "*.git*" "bump_version.py" ".github*"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.vars.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            MPU_Pro_Mini-${{ steps.vars.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
