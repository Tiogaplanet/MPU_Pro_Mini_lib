name: Deploy Doxygen API Docs to GitHub Wiki

on:
  push:
    branches:
      - master

jobs:
  deploy-wiki:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Generate Doxygen XML
        run: doxygen Doxyfile

      - name: Convert Doxygen XML to Markdown
        run: |
          mkdir -p wiki_markdown
          # Run moxygen directly via npx to convert XML output into Markdown
          npx moxygen xml/ -o wiki_markdown/API-Reference.md

      - name: Checkout Wiki Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki_repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push to Wiki
        run: |
          cp -r wiki_markdown/* wiki_repo/
          cd wiki_repo
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update API documentation from Doxygen"
            git push
          else
            echo "No changes to commit to Wiki."
          fi
