name: Deploy Doxygen to GitHub Wiki

on:
  push:
    branches:
      - master

jobs:
  deploy-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Doxygen and Doxybook2
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          wget https://github.com/matusnovak/doxybook2/releases/download/v2.1.0/doxybook2-linux-amd64.zip
          unzip doxybook2-linux-amd64.zip -d /usr/local/bin/

      - name: Generate Doxygen XML
        run: doxygen Doxyfile

      - name: Convert XML to Markdown
        run: doxybook2 --input xml --output wiki_output

      - name: Checkout Wiki Repository
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki_repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy & Push to Wiki
        run: |
          cp -r wiki_output/* wiki_repo/
          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Auto-update API docs from Doxygen"
          git push
